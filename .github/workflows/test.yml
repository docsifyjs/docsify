name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  test-jest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts/*']
        os: ['macos-latest', 'ubuntu-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Unit Tests
        run: npm run test:unit -- --ci --runInBand
      - name: Integration Tests
        run: npm run test:integration -- --ci --runInBand
      - name: Consumption Tests
        if: ${{ matrix.os != 'windows-latest' }}
        run: npm run test:consume-types
      - name: Consumption install
        if: ${{ matrix.os == 'windows-latest' }}
        id: consume_install
        working-directory: test/consume-types
        shell: pwsh
        continue-on-error: true
        run: |
          node --version
          npm --version
          npm config get cache
          npm config get script-shell
          npm config get install-links
          npm clean-install --install-links
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT

          if ($code -ne 0) {
            $cache = (npm config get cache).Trim()
            $logDir = Join-Path $cache "_logs"
            if (Test-Path $logDir) {
              Get-ChildItem $logDir -Filter "*.log" |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 5 |
                ForEach-Object {
                  Write-Host "::group::$($_.FullName)"
                  Get-Content $_.FullName -Tail 300
                  Write-Host "::endgroup::"
                }
            } else {
              Write-Host "npm log directory not found: $logDir"
            }
          }

          exit $code
      - name: Consumption installed package info
        if: ${{ always() && matrix.os == 'windows-latest' && steps.consume_install.outcome != 'skipped' }}
        working-directory: test/consume-types
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            node -e "const lock = require('./package-lock.json'); console.log('lock docsify version:', lock.packages['node_modules/docsify']?.version)"
          }

          if (Test-Path node_modules/docsify/package.json) {
            node -e "const fs = require('fs'); const p = 'node_modules/docsify'; const pkg = require('./node_modules/docsify/package.json'); console.log(JSON.stringify({ version: pkg.version, isSymlink: fs.lstatSync(p).isSymbolicLink(), realpath: fs.realpathSync(p) }, null, 2))"
            npm ls docsify --all
            if ($LASTEXITCODE -ne 0) {
              Write-Host "npm ls exited $LASTEXITCODE"
            }
          } else {
            Write-Host "node_modules/docsify/package.json is missing"
          }

          exit 0
      - name: Consumption install ignore-scripts probe
        if: ${{ always() && matrix.os == 'windows-latest' && steps.consume_install.outcome == 'failure' }}
        working-directory: test/consume-types
        shell: pwsh
        run: |
          npm clean-install --install-links --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          npm run typecheck
      - name: Consumption typecheck
        if: ${{ matrix.os == 'windows-latest' && steps.consume_install.outcome == 'success' }}
        working-directory: test/consume-types
        run: npm run typecheck
      - name: Consumption install status
        if: ${{ always() && matrix.os == 'windows-latest' && steps.consume_install.outcome == 'failure' }}
        run: |
          echo "Consumption install failed. See npm debug log output above."
          exit 1

  test-playwright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*']
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: E2E Tests (Playwright)
        run: npm run test:e2e

      # In the interest of not having to modify GitHub settings to update required
      # builds for passing, I stuck this test here.
      - name: Test v4 build
        run: |
          git fetch --tags
          npm run build:v4
          # ensure v4 build files exist:
          test -f lib/docsify.js
          test -f themes/pure.css
          # ensure no git changes after building v4:
          git diff --exit-code
          npm run clean:v4
          # ensure v4 build files are removed:
          test ! -f lib/docsify.js
          test ! -f themes/pure.css
          # ensure no git changes after cleaning v4:
          git diff --exit-code

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.os }}-${{ matrix.node-version }}-artifacts
          path: |
            _playwright-results/
            _playwright-report/
